name: Python tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Generate inventory readiness report
        run: python src/vcf_readiness.py --input data/sample_environment.json --output reports/sample-readiness-report.md
      - name: Generate checklist dashboard
        run: python src/vcf_dashboard.py
      - name: Generate and verify decision scenarios
        run: python scripts/run_scenarios.py
      - uses: actions/upload-artifact@v4
        with:
          name: vcf-readiness-artifacts
          path: |
            reports/sample-readiness-report.md
            reports/readiness-dashboard.html
            reports/readiness-dashboard-report.md
            reports/scenarios/*.html
            reports/scenarios/*.md
