name: Python tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python src/vcf_readiness.py --input data/sample_environment.json --output reports/sample-readiness-report.md
      - uses: actions/upload-artifact@v4
        with:
          name: vcf-readiness-report
          path: reports/sample-readiness-report.md
