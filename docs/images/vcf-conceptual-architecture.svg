<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Conceptual VMware Cloud Foundation architecture and readiness evidence flow</title><desc id="desc">Conceptual architecture showing administrators, SDDC Manager lifecycle control, a management domain, workload domains, shared network and storage layers, and a separate planning evidence toolkit that is not connected to live infrastructure.</desc>
<defs><style>.bg{fill:#f4f7fb}.panel{fill:#fff;stroke:#a9bfd5;stroke-width:2}.blue{fill:#e7f1fc;stroke:#3975aa;stroke-width:2}.teal{fill:#e4f7f4;stroke:#168578;stroke-width:2}.amber{fill:#fff4d8;stroke:#bd8620;stroke-width:2}.muted{fill:#eef1f5;stroke:#6c7a89;stroke-width:2}.h{font:700 27px Arial,sans-serif;fill:#102a43}.sub{font:600 20px Arial,sans-serif;fill:#173b63}.txt{font:17px Arial,sans-serif;fill:#243b53}.small{font:15px Arial,sans-serif;fill:#526579}.line{stroke:#3975aa;stroke-width:3;fill:none}.dash{stroke:#7b8794;stroke-width:2.5;stroke-dasharray:9 7;fill:none}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#3975aa"/></marker></defs>
<rect class="bg" width="1440" height="900"/>
<text x="60" y="58" class="h" font-size="32">VMware Cloud Foundation — Conceptual Architecture</text>
<text x="60" y="91" class="small">Illustrative portfolio diagram · Not a deployed environment or a release-specific reference design</text>
<rect x="60" y="125" width="250" height="115" rx="14" class="panel"/><text x="185" y="161" text-anchor="middle" class="sub">Platform operators</text><text x="185" y="190" text-anchor="middle" class="txt">Change owner · Admins</text><text x="185" y="215" text-anchor="middle" class="small">Approvals and runbooks</text>
<rect x="380" y="125" width="380" height="115" rx="14" class="blue"/><text x="570" y="161" text-anchor="middle" class="sub">SDDC Manager</text><text x="570" y="190" text-anchor="middle" class="txt">Lifecycle orchestration and inventory</text><text x="570" y="215" text-anchor="middle" class="small">Capabilities vary by VCF release</text>
<path d="M310 182 H380" class="line" marker-end="url(#arrow)"/><path d="M570 240 V282" class="line" marker-end="url(#arrow)"/>
<rect x="60" y="282" width="630" height="280" rx="16" class="blue"/><text x="85" y="320" class="sub">Management domain</text><text x="85" y="348" class="small">Hosts management and lifecycle services</text>
<rect x="90" y="374" width="260" height="75" rx="10" class="panel"/><text x="220" y="404" text-anchor="middle" class="txt">Management vCenter</text><text x="220" y="429" text-anchor="middle" class="small">vSphere management</text>
<rect x="385" y="374" width="260" height="75" rx="10" class="panel"/><text x="515" y="404" text-anchor="middle" class="txt">NSX Manager</text><text x="515" y="429" text-anchor="middle" class="small">Network and security</text>
<rect x="90" y="465" width="260" height="65" rx="10" class="panel"/><text x="220" y="492" text-anchor="middle" class="txt">ESXi host cluster</text><text x="220" y="514" text-anchor="middle" class="small">Management workloads</text>
<rect x="385" y="465" width="260" height="65" rx="10" class="panel"/><text x="515" y="492" text-anchor="middle" class="txt">Storage layer</text><text x="515" y="514" text-anchor="middle" class="small">vSAN or design-specific storage</text>
<rect x="750" y="282" width="630" height="280" rx="16" class="teal"/><text x="775" y="320" class="sub">Workload / VI domains</text><text x="775" y="348" class="small">Isolated capacity and workloads by design</text>
<rect x="780" y="374" width="260" height="75" rx="10" class="panel"/><text x="910" y="404" text-anchor="middle" class="txt">Workload vCenter</text><text x="910" y="429" text-anchor="middle" class="small">Domain management</text>
<rect x="1075" y="374" width="260" height="75" rx="10" class="panel"/><text x="1205" y="404" text-anchor="middle" class="txt">NSX services</text><text x="1205" y="429" text-anchor="middle" class="small">If included in design</text>
<rect x="780" y="465" width="260" height="65" rx="10" class="panel"/><text x="910" y="492" text-anchor="middle" class="txt">ESXi clusters</text><text x="910" y="514" text-anchor="middle" class="small">Application workloads</text>
<rect x="1075" y="465" width="260" height="65" rx="10" class="panel"/><text x="1205" y="492" text-anchor="middle" class="txt">Storage / networks</text><text x="1205" y="514" text-anchor="middle" class="small">vSAN, NFS, VLAN / overlay as designed</text>
<path d="M570 240 V260 H375 V282" class="line" marker-end="url(#arrow)"/><path d="M570 260 H1065 V282" class="line" marker-end="url(#arrow)"/>
<rect x="60" y="615" width="1320" height="95" rx="14" class="muted"/><text x="85" y="650" class="sub">Cross-domain dependencies (design-dependent)</text><text x="85" y="681" class="txt">Management · vMotion · storage · workload networks · DNS / NTP · certificates · identity · backup / recovery · monitoring</text>
<path d="M375 562 V588 H340 V615" class="dash"/><path d="M1065 562 V588 H1100 V615" class="dash"/>
<rect x="60" y="750" width="1320" height="100" rx="14" class="amber"/><text x="85" y="784" class="sub">Separate portfolio planning tool — no live integration</text><text x="85" y="812" class="txt">CSV checklist + synthetic evidence → Python decision rules → HTML dashboard + Markdown report + GitHub Actions tests</text><text x="85" y="836" class="small">Does not query SDDC Manager / vCenter / NSX / ESXi and does not validate compatibility, health, or upgrade eligibility.</text>
<path d="M720 750 V724" class="dash"/><text x="738" y="740" class="small">Planning documentation only</text>
</svg>